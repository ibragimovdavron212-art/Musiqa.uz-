<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicWave — Zamonaviy Musiqa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animation">
        <span></span><span></span><span></span>
    </div>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fas fa-headphones-alt"></i>
            <h1>Music<span>Wave</span></h1>
        </div>
        <nav>
            <a href="#home" class="active">Bosh sahifa</a>
            <a href="#songs">Qo'shiqlar</a>
            <a href="#about">Haqida</a>
        </nav>
    </header>

    <!-- Hero -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h2>Musiqa Olamiga <span>Xush Kelibsiz</span></h2>
            <p>Eng sara qo'shiqlarni tinglang, kayfiyatingizni ko'taring 🎧</p>
            <button class="btn-play" onclick="playRandom()">
                <i class="fas fa-play"></i> Tasodifiy ijro
            </button>
        </div>
    </section>

    <!-- Songs Grid -->
    <section class="songs-section" id="songs">
        <h2 class="section-title">🎵 Mashhur Qo'shiqlar</h2>
        <div class="songs-grid" id="songsGrid">
            <!-- JS orqali to'ldiriladi -->
        </div>
    </section>

    <!-- Player Bar (Fixed Bottom) -->
    <div class="player">
        <div class="player-info">
            <img id="playerCover" src="covers/cover1.jpg" alt="cover">
            <div>
                <h4 id="playerTitle">Qo'shiq nomi</h4>
                <p id="playerArtist">Ijrochi</p>
            </div>
        </div>

        <div class="player-controls">
            <button onclick="prevSong()"><i class="fas fa-backward"></i></button>
            <button class="play-btn" onclick="togglePlay()">
                <i class="fas fa-play" id="playIcon"></i>
            </button>
            <button onclick="nextSong()"><i class="fas fa-forward"></i></button>
        </div>

        <div class="player-progress">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" value="0" min="0" max="100">
            <span id="duration">0:00</span>
        </div>

        <div class="player-volume">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <audio id="audio"></audio>

    <!-- Footer -->
    <footer id="about">
        <p>© 2025 MusicWave | Yaratildi ❤️ bilan</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
